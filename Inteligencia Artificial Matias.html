<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: white;
  color: black;
}

.dark {
  background: #121212;
  color: white;
}
</style>
</head>

<body>

<center><button id="botonModo" onclick="cambiarModo()">Modo oscuro</button></center>

<script>
function cambiarModo() {
  document.body.classList.toggle("dark");

  let boton = document.getElementById("botonModo");

  if (document.body.classList.contains("dark")) {
    boton.textContent = "Modo claro";
  } else {
    boton.textContent = "Modo oscuro";
  }
}

</script>


</body>
</html>
